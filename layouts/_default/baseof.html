<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {{- if .IsHome }}
  <title>{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Site.Params.description }}" />
  {{- else }}
  <title>{{ .Title }} — {{ .Site.Title }}</title>
  {{- end }}
  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" href="images/logo-no-background.svg" type="image/svg+xml" />
  {{- if .IsHome }}
  <link rel="alternate" type="application/rss+xml" title="ErasLumina Dev Log" href="index.xml" />
  {{- end }}
</head>
<body>
  {{ partial "nav.html" . }}
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
</body>
</html>
